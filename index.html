<!DOCTYPE html>
<html>
<head>
  <title>My Avatar Website</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

  body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 100vh;
  }

  h1 {
    margin-top: 40px;
    font-size: 48px;
  }

  p {
    font-size: 22px;
    margin-bottom: 30px;
  }

  .avatar-container {
    width: 90%;
    max-width: 900px;
  }

  iframe {
    width: 100%;
    height: 500px;
    border: none;
  }

  /* MOBILE VERSION */
  @media (max-width: 768px) {

    h1 {
      font-size: 36px;
    }

    p {
      font-size: 18px;
    }

    iframe {
      height: 400px;
    }

  }

</style>
</head>

<body>

  <h1>NovaPharma</h1>

  <p>Welcome to Ludwig - Your AI Rep.</p>

  <div class="avatar-container">

<iframe src="https://embed.liveavatar.com/v1/984b36fe-0cd3-4915-a0d8-ab04d8b02354?orientation=horizontal" allow="microphone" title="LiveAvatar Embed" style="aspect-ratio: 16/9;"></iframe>

  </div>

</body>
</html>
